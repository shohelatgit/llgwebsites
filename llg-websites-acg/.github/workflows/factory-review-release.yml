name: Factory review validation and release

on:
  pull_request:
    paths:
      - "factory/**"
      - "integrations/launch-lead-gen/**"
      - ".github/workflows/factory-review-release.yml"
  push:
    branches: [main]
    paths:
      - "factory/**"
      - "integrations/launch-lead-gen/**"
      - ".github/workflows/factory-review-release.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Validation only or deploy the noindex review portfolio
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy-review
      site:
        description: Optional source ID, domain, or Worker name for a single-site review deployment
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: factory-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            factory/package-lock.json
            integrations/launch-lead-gen/package-lock.json
      - name: Validate factory release
        working-directory: factory
        run: |
          npm ci
          npm run cloudflare:prepare-sites
          npm run factory:validate
          npm run factory:validate-source
          npm run cloudflare:build-site-index
      - name: Validate intake registry and tests
        working-directory: integrations/launch-lead-gen
        run: |
          npm install --include=optional --ignore-scripts
          npm run sync:factory-sites -- --roster ../../factory/review/homepage-palettes/airtable-websites.json
          npm run check
          npm test

  deploy-review:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-review')
    runs-on: ubuntu-latest
    environment: cloudflare-review
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            factory/package-lock.json
            integrations/launch-lead-gen/package-lock.json
      - name: Deploy test-mode intake registry
        working-directory: integrations/launch-lead-gen
        run: |
          npm install --include=optional --ignore-scripts
          npm run sync:factory-sites -- --roster ../../factory/review/homepage-palettes/airtable-websites.json
          npm run check
          npm test
          npm run deploy:staging
      - name: Deploy shared review runtime
        working-directory: factory
        run: |
          npm ci
          npm run cloudflare:prepare-sites
          npm run factory:validate
          npm run factory:validate-source
          npm run cloudflare:deploy-review
      - name: Deploy site Workers
        working-directory: factory
        shell: bash
        run: |
          if [[ -n "${{ inputs.site }}" ]]; then
            npm run cloudflare:deploy-sites -- --site "${{ inputs.site }}" --concurrency 1
          else
            npm run cloudflare:deploy-sites -- --concurrency 3
          fi
      - name: Deploy review index
        working-directory: factory
        run: |
          npm run cloudflare:build-site-index
          npm run cloudflare:deploy-index
      - name: Verify all review sites and intake origins
        working-directory: factory
        run: npm run cloudflare:verify-sites
