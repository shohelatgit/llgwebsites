name: Validate sites

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  portfolio-audit:
    name: Portfolio static audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install audit dependency
        run: python -m pip install --requirement requirements-ci.txt

      - name: Check patch formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Run the 29-site static audit
        run: python tools/audit-static-sites.py

      - name: Report which sites will deploy after merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/select-deploy-sites.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --site changed
