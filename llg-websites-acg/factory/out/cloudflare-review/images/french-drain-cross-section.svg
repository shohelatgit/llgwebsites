<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">How a French drain works</title>
  <desc id="description">A labeled cross-section showing surface water passing through topsoil, filter fabric and clean stone into a perforated pipe that carries water to a safe discharge point.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5z" fill="#2f80ff"/>
    </marker>
    <pattern id="stone" width="42" height="32" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="11" r="8" fill="#aeb9c8"/>
      <circle cx="30" cy="21" r="9" fill="#8795a8"/>
      <circle cx="8" cy="29" r="6" fill="#c7d0dc"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" rx="22" fill="#f4f7fc"/>
  <rect x="54" y="70" width="1092" height="560" rx="18" fill="#fff" stroke="#d7deea" stroke-width="3"/>

  <path d="M95 196C230 175 350 207 485 188c150-21 267 15 410-8 87-14 154-8 210 6v403H95z" fill="#8c5d3d"/>
  <path d="M95 191c119-20 239 10 369-7 151-20 275 14 423-9 84-13 156-6 218 9v35c-61-17-135-23-220-10-146 23-273-12-420 8-131 18-251-13-370 7z" fill="#55a44e"/>

  <path d="M370 213h460l-42 346H414z" fill="#24324b" opacity=".95"/>
  <path d="M395 226h410l-35 319H430z" fill="url(#stone)" stroke="#cad3df" stroke-width="3"/>
  <path d="M383 218l24 10-5 43 27 7-28 43 23 35-27 38 26 43-22 37 23 46-20 35 17 39h-28l-34-344z" fill="#111a2e"/>
  <path d="M816 218l-24 10 5 43-27 7 28 43-23 35 27 38-26 43 22 37-23 46 20 35-17 39h28l34-344z" fill="#111a2e"/>

  <ellipse cx="600" cy="468" rx="151" ry="71" fill="#111827" stroke="#050816" stroke-width="6"/>
  <ellipse cx="600" cy="468" rx="120" ry="48" fill="#26344f"/>
  <g fill="#7e8ba0">
    <rect x="505" y="430" width="16" height="11" rx="5"/>
    <rect x="547" y="421" width="16" height="11" rx="5"/>
    <rect x="589" y="418" width="16" height="11" rx="5"/>
    <rect x="631" y="421" width="16" height="11" rx="5"/>
    <rect x="673" y="430" width="16" height="11" rx="5"/>
    <rect x="505" y="492" width="16" height="11" rx="5"/>
    <rect x="547" y="503" width="16" height="11" rx="5"/>
    <rect x="589" y="507" width="16" height="11" rx="5"/>
    <rect x="631" y="503" width="16" height="11" rx="5"/>
    <rect x="673" y="492" width="16" height="11" rx="5"/>
  </g>

  <g fill="none" stroke="#2f80ff" stroke-linecap="round" stroke-width="8" marker-end="url(#arrow)">
    <path d="M265 120c0 70 38 80 82 104"/>
    <path d="M600 105v117"/>
    <path d="M920 120c0 70-38 80-82 104"/>
    <path d="M520 316v88"/>
    <path d="M600 300v96"/>
    <path d="M680 316v88"/>
    <path d="M742 468h147"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0d1326">
    <text x="95" y="112" font-size="26" font-weight="700">Rain and groundwater</text>
    <text x="95" y="144" font-size="18" fill="#5d687d">Water follows the easiest path down.</text>

    <line x1="117" y1="278" x2="326" y2="278" stroke="#2f80ff" stroke-width="3"/>
    <circle cx="326" cy="278" r="7" fill="#2f80ff"/>
    <text x="105" y="265" font-size="23" font-weight="700">Topsoil and turf</text>
    <text x="105" y="305" font-size="17" fill="#182235">The finished surface is restored.</text>

    <line x1="908" y1="292" x2="807" y2="292" stroke="#2f80ff" stroke-width="3"/>
    <circle cx="807" cy="292" r="7" fill="#2f80ff"/>
    <text x="925" y="280" font-size="23" font-weight="700">Filter fabric</text>
    <text x="925" y="320" font-size="17" fill="#182235">Keeps soil from clogging the stone.</text>

    <line x1="123" y1="397" x2="414" y2="397" stroke="#2f80ff" stroke-width="3"/>
    <circle cx="414" cy="397" r="7" fill="#2f80ff"/>
    <text x="105" y="384" font-size="23" font-weight="700">Clean drainage stone</text>
    <text x="105" y="424" font-size="17" fill="#182235">Creates open space for water to move.</text>

    <line x1="911" y1="468" x2="752" y2="468" stroke="#2f80ff" stroke-width="3"/>
    <circle cx="752" cy="468" r="7" fill="#2f80ff"/>
    <text x="925" y="448" font-size="23" font-weight="700">Perforated pipe</text>
    <text x="925" y="486" font-size="17" fill="#182235">Collects water along the trench.</text>
    <text x="925" y="513" font-size="17" fill="#182235">The solid outlet runs to discharge.</text>

    <rect x="360" y="590" width="480" height="62" rx="12" fill="#0d1326"/>
    <text x="600" y="628" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Water exits at a safe discharge point →</text>
  </g>
</svg>
